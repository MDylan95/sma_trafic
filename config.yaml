simulation:
  duration: 3600
  time_step: 2
  num_vehicles: 300
  random_seed: 42
environment:
  width: 5000
  height: 5000
  cell_size: 10
intersection:
  min_green_time: 15
  max_green_time: 90
  default_green_time: 30
  yellow_time: 3
  congestion_threshold: 10
  perception_radius: 200
vehicle:
  max_speed: 22.22
  min_speed: 0
  max_acceleration: 3.5
  max_deceleration: 4.5
  safe_distance: 5.0
  perception_radius: 100
communication:
  protocol: FIPA-ACL
  broadcast_radius: 500
  message_delay: 0.1
  message_types:
  - REQUEST
  - INFORM
  - PROPOSE
  - ACCEPT
  - REJECT
  - QUERY
algorithms:
  routing:
    algorithm: A_STAR
    recalculation_interval: 30
  traffic_light:
    algorithm: Q_LEARNING
    learning_rate: 0.1
    discount_factor: 0.9
    epsilon: 0.1
    epsilon_decay: 0.995
scenarios:
  rush_hour_morning:
    name: Heure de pointe matinale
    description: Flux Yopougon/Abobo vers Plateau
    start_time: 0
    duration: 3600
    origin_zones:
    - name: Yopougon
      weight: 0.5
      bbox:
      - -4.080
      - 5.310
      - -4.000
      - 5.380
    - name: Abobo
      weight: 0.5
      bbox:
      - -4.000
      - 5.370
      - -3.900
      - 5.480
    destination_zones:
    - name: Plateau
      weight: 1.0
      bbox:
      - -4.030
      - 5.295
      - -3.985
      - 5.335
    vehicle_generation_rate: 2.0
    use_real_coords: true
  incident_bridge:
    name: Incident Pont De Gaulle
    description: Panne véhicule sur Pont De Gaulle -> redirection Pont HKB
    start_time: 300
    duration: 120
    blocked_road:
      name: Pont De Gaulle
      coordinates:
      - - 2000
        - 0
      - - 2000
        - 4000
    alternative_road:
      name: Pont HKB
      coordinates:
      - - 3000
        - 0
      - - 3000
        - 4000
kpis:
- average_travel_time
- average_queue_length
- total_messages_exchanged
- average_speed
- congestion_level
- fuel_consumption
database:
  type: postgresql
  postgresql:
    host: localhost
    port: 5432
    database: traffic_sma
    user: postgres
    password: '1030'
visualization:
  enabled: true
  update_interval: 1
  show_messages: true
  show_routes: true
  colormap: viridis
  figure_size:
  - 12
  - 10
logging:
  level: INFO
  file: data/logs/simulation.log
  console: true
  rotation: 10 MB
